# Self-hosted n8n for WorkRadar (free Community Edition).
# Start:  docker compose -f n8n/docker-compose.yml up -d
# Open:   http://localhost:5678
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      # Set this to your public tunnel URL so the editor shows the right Production URLs.
      # - WEBHOOK_URL=https://your-tunnel.trycloudflare.com/
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
    external: true
